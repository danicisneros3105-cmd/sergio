[project]
name = "sergio-escritorio"
version = "0.1.0"
description = "Sergio en Windows: compañero junto al cursor, voz y control de la pantalla."
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "pillow>=10.0",
    "pynput>=1.7",
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "sounddevice>=0.4",
    "faster-whisper>=1.1",
    "edge-tts>=7.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.gui-scripts]
sergio-escritorio = "sergio_escritorio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sergio_escritorio"]
