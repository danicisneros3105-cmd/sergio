[project]
name = "sergio-escritorio"
version = "0.1.0"
description = "Sergio en Windows: compañero junto al cursor, voz y control de la pantalla."
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "pillow>=10.0",
    "pynput>=1.7",
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "sounddevice>=0.4",
    "faster-whisper>=1.1",
    "edge-tts>=7.0",
    "opencv-python-headless>=4.10,<5",  # 5.0 dropped the Haar face detector
    "numpy>=1.26",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "websockets>=13",  # live calls with Sergio (Gemini Live via the server)
]

[project.optional-dependencies]
# Eyes and hands: objects, face mesh and the holograms you shape (MediaPipe).
manos = ["mediapipe>=1.0"]
# Echo cancellation for calls on laptop speakers (WebRTC audio processing).
llamada = ["livekit>=1.0"]
# "Sergio" heard at once, while you are still talking (Vosk, offline).
oido = ["vosk>=0.3.45"]
# Modern object detector (YOLO11, Ultralytics): far fewer mistakes than the
# old EfficientDet (a hand is not a banana, a window is not a TV).
vision = ["ultralytics>=8.3"]
# The same on the NVIDIA card (CUDA PyTorch, ~2.5 GB): YOLO11-m + YOLOE at
# 15+ frames a second instead of ~3 on the processor.
vision-gpu = ["ultralytics>=8.3", "torch>=2.4", "torchvision>=0.19"]
# NVIDIA GPU for a much better ear (Whisper large-v3-turbo). Big download
# (~1 GB); the installer tries it but Sergio works on the CPU without it.
gpu = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12>=12.4; sys_platform == 'win32'",
]

[project.gui-scripts]
sergio-escritorio = "sergio_escritorio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sergio_escritorio"]

[tool.uv]
# MediaPipe brings opencv-contrib and the app opencv-headless: Ultralytics'
# own opencv-python would be a third copy of cv2 fighting the others.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]
conflicts = [[{ extra = "vision" }, { extra = "vision-gpu" }]]
# Only ever installed on Windows: resolve for Windows only.
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", extra = "vision-gpu" }]
torchvision = [{ index = "pytorch-cuda", extra = "vision-gpu" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
