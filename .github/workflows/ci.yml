name: CI

# Minutes matter: this repository is private, where Windows runners cost 2x
# and macOS 10x of the monthly allowance. Every push runs the Linux jobs;
# the Windows/macOS matrix runs weekly, on demand, or when a commit message
# contains [full-ci].
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # publishes the coverage badge to the "badges" branch
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra framework-comparison --extra server

      - name: Build Rust extension
        run: uv run maturin develop --manifest-path rust/crates/openjarvis-python/Cargo.toml

      - name: Run tests
        # COVERAGE_CORE=sysmon uses CPython 3.12's sys.monitoring backend,
        # which is dramatically cheaper than the default C trace function.
        # -n auto fans the suite out across all runner cores via pytest-xdist.
        env:
          COVERAGE_CORE: sysmon
        run: |
          uv run pytest tests/ -n auto -q --tb=short -m "not live and not cloud and not hub" \
            --cov=openjarvis \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Coverage summary and badge
        if: always() && hashFiles('coverage.xml') != ''
        shell: bash
        run: |
          uv run python scripts/ci/coverage_badge.py coverage.xml badge >> "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('badge/coverage.svg') != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd badge
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -qm "Coverage badge"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  # Windows job — empirically exercises the platform-specific code paths that
  # the Ubuntu `test` job can never reach: GlobalMemoryStatusEx RAM detection
  # (#373) and the cp9xx -> UTF-8 stdout reconfigure (#293). Also the only CI
  # job that builds + imports the mandatory `openjarvis_rust` PyO3 extension
  # on Windows. Public repo -> Windows runner minutes are free.
  #
  # All `run:` steps use static commands only (no `github.event.*`
  # interpolation), so there is no workflow-injection surface here.
  test-windows:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ${{ matrix.os }}
    # The ARM64 runner is newer; its result is reported but never blocks a merge.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # Windows Server 2022 and 2025 builds (both Windows 10/11 kernels in the
        # field) x 3.12 = common; 3.13 = the supported ceiling — installing
        # there guards against a numpy/native wheel gap at the top of the range
        # (#350), which is exactly how the source-build failure slips in.
        os: [windows-2022, windows-2025]
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          # Windows on ARM (Snapdragon laptops): RAM detection must work there too.
          - os: windows-11-arm
            python-version: "3.12"
            experimental: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra server

      # Pure-Python check — runs before the Rust build so a flaky toolchain
      # install can never mask the actual RAM-detection verification.
      - name: Verify Windows RAM detection (#373)
        shell: bash
        # Not just "> 0": the value must match what Windows itself reports
        # (CIM), so a wrong struct layout or unit can't pass silently.
        run: |
          uv run python - <<'PY'
          import subprocess
          from openjarvis.core.config import _total_ram_gb, detect_hardware
          ram = _total_ram_gb()
          cim = subprocess.run(
              ["powershell", "-NoProfile", "-Command",
               "(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory"],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          ref = int(cim) / 1024**3
          print(f"GlobalMemoryStatusEx RAM = {ram} GB, CIM = {ref:.1f} GB")
          assert ram > 0, f"Windows RAM detection returned {ram}, expected > 0"
          assert abs(ram - ref) < 0.6, f"RAM mismatch: {ram} vs {ref:.1f} GB"
          hw = detect_hardware()
          assert hw.ram_gb == ram, (hw.ram_gb, ram)
          print("detect_hardware():", hw)
          PY

      - name: Run Windows-specific tests (hardware + CLI + daemon)
        shell: bash
        run: |
          uv run pytest tests/hardware/test_hardware_profiles.py tests/cli/test_cli.py tests/cli/test_daemon_cmd.py tests/cli/test_daemon_state.py tests/core/test_utils.py -v -m "not live and not cloud"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build + import the PyO3 extension on Windows
        shell: bash
        run: |
          uv run maturin develop --manifest-path rust/crates/openjarvis-python/Cargo.toml
          uv run python -c "import openjarvis_rust; print('openjarvis_rust imports on Windows OK')"

      - name: Smoke-test CLI
        shell: bash
        run: |
          uv run jarvis --version

  # RAM/hardware detection on the other desktop OSes, checked against the
  # OS's own numbers (Linux: /proc/meminfo via free; macOS: sysctl).
  hardware-detect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-ci]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Verify RAM detection
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then REF=$(sysctl -n hw.memsize); else REF=$(free -b | awk '/^Mem:/{print $2}'); fi
          REF="$REF" uv run --no-project --with-editable . python - <<'PY'
          import os
          from openjarvis.core.config import _total_ram_gb
          ram, ref = _total_ram_gb(), int(os.environ["REF"]) / 1024**3
          print(f"detected {ram} GB, OS says {ref:.1f} GB")
          assert ram > 0 and abs(ram - ref) < 0.6, (ram, ref)
          PY

  # Speed regressions: timings are expressed in units of a fixed pure-Python
  # workload measured on the same runner, so the baseline travels between
  # machines; a step fails when it gets more than 1.75x slower.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra server

      - name: Performance smoke benchmark
        run: uv run python benchmarks/perf_smoke.py --check benchmarks/perf_baseline.json --summary "$GITHUB_STEP_SUMMARY"

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Clippy + cargo test take minutes; skip them when no Rust changed.
      - name: Did Rust change?
        id: changes
        shell: bash
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if [[ -z "$from" || "$from" =~ ^0+$ ]] || ! git cat-file -e "$from^{commit}" 2>/dev/null \
             || git diff --name-only "$from" HEAD | grep -qE '^(rust/|examples/cross_device_travel/|\.github/workflows/ci\.yml)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace

      # Standalone handoff example: intentionally not a runtime workspace member.
      - name: Cross-device travel example
        if: steps.changes.outputs.rust == 'true'
        run: |
          cargo fmt --manifest-path ../examples/cross_device_travel/Cargo.toml --check
          cargo clippy --locked --manifest-path ../examples/cross_device_travel/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path ../examples/cross_device_travel/Cargo.toml
