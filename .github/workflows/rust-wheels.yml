name: Rust wheels

# Pre-built `openjarvis_rust` wheels, so nobody has to install Rust and compile
# the native engine (memory, search) on their own machine. The extension is
# built against the stable ABI (abi3-py310), so one wheel per platform serves
# Python 3.10 and newer. Wheels land on the rolling `rust-wheels` release, which
# the installers read with `--find-links` before falling back to a local build.

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin, manylinux: "" }
          - { name: macos-x86_64, os: macos-13, target: x86_64-apple-darwin, manylinux: "" }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel (cross-compiled where needed)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: "1.88"
          working-directory: rust/crates/openjarvis-python
          args: --release --out ${{ github.workspace }}/dist
          sccache: "true"

      - name: Smoke-test the wheel (native targets only)
        if: matrix.name != 'linux-aarch64'
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist openjarvis-rust
          python -c "import openjarvis_rust; print('openjarvis_rust imports OK')"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  release:
    name: Publish to the rust-wheels release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Upload wheels (replacing the previous build)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release view rust-wheels --repo "$REPO" >/dev/null 2>&1 \
            || gh release create rust-wheels --repo "$REPO" --prerelease \
                 --title "Native engine wheels (openjarvis_rust)" \
                 --notes "Pre-built openjarvis_rust wheels, rebuilt on every change to rust/. Installers use them automatically."
          gh release upload rust-wheels dist/*.whl --repo "$REPO" --clobber
          gh release edit rust-wheels --repo "$REPO" --notes "Pre-built openjarvis_rust wheels (abi3, Python >= 3.10) from ${SHA}. Installers use them automatically; nothing to download by hand."
