<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b11" />
  <meta name="description" content="Sergio — tu asistente personal" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=marca2" />
  <link rel="icon" href="/favicon.ico?v=marca2" sizes="48x48" />
  <link rel="icon" href="/sergio.svg?v=marca2" type="image/svg+xml" />
  <title>Sergio</title>
  <style>
    #sg-arranque { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
      padding: 24px; box-sizing: border-box; background: #f5f5f7; color: #1d1d1f;
      text-align: center; font: 16px/1.5 system-ui, sans-serif; }
    #sg-arranque > div { max-width: 360px; }
    #sg-arranque h1 { font-size: 22px; margin: 12px 0 0; }
    #sg-arranque p { margin: 8px 0 16px; }
    #sg-arranque a { display: inline-block; padding: 8px 18px; border-radius: 999px;
      background: #005ec5; color: white; text-decoration: none; }
    #root:not(:empty) + #sg-arranque { display: none; }
    @media (prefers-color-scheme: dark) {
      #sg-arranque { background: #1c1c1e; color: #f5f5f7; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <main id="sg-arranque">
    <div>
      <svg width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="#0a6cfe" />
        <circle cx="50" cy="50" r="13.7" fill="none" stroke="white" stroke-width="10.2" />
      </svg>
      <h1>Sergio</h1>
      <p id="sg-arranque-estado" role="status">Abriendo la aplicación…</p>
      <a id="sg-recargar" href="">Recargar</a>
    </div>
  </main>
  <script async src="/arranque.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
