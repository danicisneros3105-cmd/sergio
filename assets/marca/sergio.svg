<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Sergio's mark: the fruit fly whose brain is his core, seen from above,
       wings swept back over the body as a resting fly holds them. -->
  <rect width="100" height="100" rx="23" fill="#0d0d0d"/>
  <g transform="translate(0 2)">
    <ellipse cx="38.5" cy="59" rx="11" ry="25" transform="rotate(24 38.5 59)" fill="#ffffff" fill-opacity="0.30" stroke="#ffffff" stroke-width="2.6"/>
    <ellipse cx="61.5" cy="59" rx="11" ry="25" transform="rotate(-24 61.5 59)" fill="#ffffff" fill-opacity="0.30" stroke="#ffffff" stroke-width="2.6"/>
    <ellipse cx="50" cy="61" rx="8.5" ry="16" fill="#ffffff"/>
    <ellipse cx="50" cy="40" rx="9.5" ry="8.5" fill="#ffffff"/>
    <ellipse cx="50" cy="26" rx="9.5" ry="7" fill="#ffffff"/>
    <ellipse cx="43.6" cy="25" rx="3.6" ry="4.6" fill="#0d0d0d"/>
    <ellipse cx="56.4" cy="25" rx="3.6" ry="4.6" fill="#0d0d0d"/>
  </g>
</svg>
