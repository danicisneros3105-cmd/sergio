# Production web deployment for Sergio. Every sync:false value is supplied by
# the operator in Render; no provider, payment or SMTP secret belongs in Git.
services:
  - type: web
    name: sergio-web
    runtime: docker
    plan: 1c-2g
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine cloud --model openrouter/google/gemini-2.5-flash
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    disk:
      name: sergio-data
      mountPath: /home/openjarvis/.openjarvis
      sizeGB: 10
    envVars:
      - key: PORT
        value: "10000"
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
      # Administrative key for the operator's API clients, never a VITE value.
      - key: OPENJARVIS_API_KEY
        generateValue: true
      - key: SERGIO_EDICION
        value: publica
      - key: SERGIO_REGISTRO
        value: abierto
      - key: SERGIO_PLANES_ACTIVOS
        value: "1"
      - key: SERGIO_CIFRAR
        value: "1"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MANAGEMENT_KEY
        sync: false
      - key: SERGIO_CLAVE_MAESTRA
        sync: false
      - key: SERGIO_PUBLIC_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SERGIO_SMTP_HOST
        sync: false
      - key: SERGIO_SMTP_FROM
        sync: false
      - key: SERGIO_LEGAL_OPERATOR
        sync: false
      - key: SERGIO_LEGAL_CONTACT
        sync: false
      - key: SERGIO_LEGAL_JURISDICTION
        sync: false
